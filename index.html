<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>byeol × DOT — Accessibility Prototype Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{background:#141414;color:#e5e5e5;font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden}
:lang(en) body{font-family:'Space Grotesk',sans-serif}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img,svg{display:block}

/* ── NAV ── */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  height:68px;padding:0 4%;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to bottom,rgba(20,20,20,.95) 0%,transparent 100%);
  transition:background .4s;
}
.nav.scrolled{background:rgba(20,20,20,.98)}
.nav-left{display:flex;align-items:center;gap:32px}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-dot-grid{width:28px;height:28px;background:#6b46f0;border-radius:7px;display:grid;grid-template-columns:repeat(3,1fr);gap:2.5px;padding:5px}
.nav-dot-grid span{background:rgba(255,255,255,.92);border-radius:50%}
.nav-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.3px;color:#fff}
.nav-brand em{font-style:normal;color:#a78bfa}
.nav-brand .x{color:rgba(255,255,255,.3);margin:0 6px;font-weight:300}
.nav-links{display:flex;gap:20px}
.nav-link{font-size:13px;color:rgba(255,255,255,.65);transition:color .15s;white-space:nowrap}
.nav-link:hover{color:#fff}
.nav-right{display:flex;align-items:center;gap:16px}
.lang-toggle{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:99px;padding:3px}
.lang-btn{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;padding:4px 12px;border-radius:99px;color:rgba(255,255,255,.55);transition:all .18s;cursor:pointer;background:transparent;border:none}
.lang-btn.active{background:#6b46f0;color:#fff}
.lang-btn:focus-visible{outline:2px solid #a78bfa;outline-offset:2px}

/* ── HERO ── */
.hero{
  position:relative;width:100%;
  height:min(88vh,720px);
  display:flex;align-items:flex-end;overflow:hidden;
  background:#0a0a0a;
}
.hero-bg{position:absolute;inset:0;overflow:hidden}
.hero-bg svg{width:100%;height:100%;object-fit:cover;transform:scale(1.05)}
.hero-vignette-l{position:absolute;inset:0;background:linear-gradient(to right,rgba(20,20,20,.98) 0%,rgba(20,20,20,.72) 40%,rgba(20,20,20,.15) 65%,transparent 100%)}
.hero-vignette-b{position:absolute;inset:0;background:linear-gradient(to top,#141414 0%,rgba(20,20,20,.6) 30%,transparent 70%)}
.hero-content{position:relative;z-index:1;padding:0 4% 7%;max-width:680px}
.hero-meta{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.hero-meta-badge{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#a78bfa;border:1px solid rgba(167,139,250,.35);background:rgba(107,70,240,.12);padding:5px 14px;border-radius:99px}
.hero-match{font-size:12px;color:#46d369;font-weight:700;font-family:'Space Grotesk',sans-serif}
.hero-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(32px,4.5vw,58px);font-weight:800;line-height:1.1;letter-spacing:-.03em;color:#fff;margin-bottom:14px;text-shadow:2px 2px 8px rgba(0,0,0,.5)}
.hero-title span{color:#a78bfa}
.hero-desc{font-size:15px;color:rgba(255,255,255,.78);line-height:1.75;max-width:480px;margin-bottom:28px;text-shadow:1px 1px 4px rgba(0,0,0,.5)}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.hero-btn-play{display:flex;align-items:center;gap:9px;padding:13px 32px;background:#fff;color:#111;border-radius:6px;font-size:16px;font-weight:700;font-family:'Space Grotesk',sans-serif;transition:background .15s,transform .1s;cursor:pointer;border:none}
.hero-btn-play:hover{background:rgba(255,255,255,.84);transform:scale(1.03)}
.hero-btn-play:active{transform:scale(.97)}
.hero-btn-info{display:flex;align-items:center;gap:9px;padding:13px 28px;background:rgba(109,109,110,.7);color:#fff;border-radius:6px;font-size:16px;font-weight:700;font-family:'Space Grotesk',sans-serif;transition:background .15s;cursor:pointer;border:none;backdrop-filter:blur(4px)}
.hero-btn-info:hover{background:rgba(109,109,110,.5)}
.hero-btn-play:focus-visible,.hero-btn-info:focus-visible{outline:2px solid #a78bfa;outline-offset:2px}

/* ── ROWS ── */
.rows{padding:0 4% 80px;margin-top:-6vh;position:relative;z-index:2}
.row{margin-bottom:48px}
.row:hover .row-title{color:#fff}
.row-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;color:rgba(255,255,255,.72);margin-bottom:12px;letter-spacing:-.2px;transition:color .2s;cursor:default}
.row-title .row-arrow{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#4a9eff;opacity:0;transition:opacity .2s;font-weight:500}
.row:hover .row-arrow{opacity:1}

/* ── TRACK + CARD ── */
.track-wrap{position:relative}
.track{
  display:flex;gap:6px;
  overflow-x:auto;padding-bottom:4px;
  scroll-snap-type:x mandatory;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.track::-webkit-scrollbar{display:none}

/* Card */
.card{
  flex-shrink:0;width:clamp(200px,calc(20vw - 8px),280px);
  scroll-snap-align:start;cursor:pointer;outline:none;
  transform-origin:center center;
  transition:transform .28s cubic-bezier(.4,0,.2,1),z-index 0s .28s;
  position:relative;z-index:0;border-radius:4px;overflow:visible;
}
.card:hover,.card:focus-visible{transform:scale(1.09);z-index:10;transition:transform .28s cubic-bezier(.4,0,.2,1),z-index 0s 0s}
/* Edge cards expand inward */
.track .card:first-child:hover{transform-origin:left center}
.track .card:last-child:hover{transform-origin:right center}

.card-inner{border-radius:4px;overflow:hidden;box-shadow:0 0 0 0 rgba(0,0,0,0);transition:box-shadow .28s}
.card:hover .card-inner,.card:focus-visible .card-inner{box-shadow:0 8px 40px rgba(0,0,0,.85)}

.card-thumb{aspect-ratio:16/9;position:relative;background:#000;overflow:hidden}
.card-thumb svg{display:block;width:100%;height:100%;transition:filter .28s}
.card:hover .card-thumb svg,.card:focus-visible .card-thumb svg{filter:brightness(1.06)}

/* Popup info — slides in below thumb on hover */
.card-popup{
  background:#1f1f1f;padding:10px 12px 12px;border-radius:0 0 4px 4px;
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .22s .04s,padding .28s;
  padding-top:0;padding-bottom:0;
}
.card:hover .card-popup,.card:focus-visible .card-popup{max-height:140px;opacity:1;padding:10px 12px 12px}

.popup-buttons{display:flex;gap:7px;align-items:center;margin-bottom:9px}
.popup-btn-play{width:30px;height:30px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;transition:background .15s;cursor:pointer}
.popup-btn-play:hover{background:rgba(255,255,255,.8)}
.popup-btn-circle{width:30px;height:30px;border:2px solid rgba(255,255,255,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:rgba(255,255,255,.7);transition:border-color .15s;cursor:pointer}
.popup-btn-circle:hover{border-color:#fff;color:#fff}
.popup-match{margin-left:auto;font-size:11px;font-weight:700;color:#46d369;font-family:'Space Grotesk',sans-serif}
.popup-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.popup-tag{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;padding:2px 7px;border-radius:3px}
.popup-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;color:#fff;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.popup-desc{font-size:10.5px;color:rgba(255,255,255,.6);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── FOOTER ── */
.site-footer{border-top:1px solid #2a2a2a;padding:28px 4%;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.footer-logo{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:800;color:rgba(255,255,255,.25);letter-spacing:-.3px}
.footer-logo em{font-style:normal;color:rgba(167,139,250,.35)}
.footer-meta{font-family:'DM Mono',monospace;font-size:11px;color:rgba(255,255,255,.25)}
.footer-links{display:flex;gap:16px}
.footer-link{font-size:12px;color:rgba(255,255,255,.35);transition:color .15s}
.footer-link:hover{color:rgba(255,255,255,.7)}

/* ── SKIP NAV ── */
.skip{position:absolute;top:-100px;left:8px;background:#6b46f0;color:#fff;padding:8px 16px;border-radius:5px;font-size:13px;font-weight:700;z-index:9999}
.skip:focus{top:8px}

/* ── SR ── */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ── RESPONSIVE ── */
@media(max-width:900px){.nav-links{display:none}.hero-title{font-size:clamp(28px,5vw,42px)}}
@media(max-width:600px){.card{width:clamp(160px,44vw,200px)}.hero-content{padding:0 5% 8%}.rows{padding:0 5% 60px}}
</style>
</head>
<body>

<a href="#main" class="skip">Skip to main content</a>

<nav class="nav" id="navbar" aria-label="Main navigation">
  <div class="nav-left">
    <div class="nav-logo">
      <div class="nav-dot-grid" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="nav-brand"><em>byeol</em><span class="x">&#215;</span>DOT</div>
    </div>
    <div class="nav-links" role="list">
      <a class="nav-link" id="nl-home" href="#" role="listitem">Home</a>
      <a class="nav-link" id="nl-a11y" href="#row-accessibility" role="listitem">Accessibility</a>
      <a class="nav-link" id="nl-game" href="#row-game" role="listitem">Game</a>
      <a class="nav-link" id="nl-ai" href="#row-ai" role="listitem">AI Tools</a>
    </div>
  </div>
  <div class="nav-right">
    <div class="lang-toggle" role="group" aria-label="Language selector">
      <button class="lang-btn active" id="btn-ko" onclick="setLang('ko')" aria-pressed="true">KO</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')" aria-pressed="false">EN</button>
    </div>
  </div>
</nav>

<section class="hero" aria-labelledby="hero-title">
  <div class="hero-bg" id="heroBg" aria-hidden="true"></div>
  <div class="hero-vignette-l" aria-hidden="true"></div>
  <div class="hero-vignette-b" aria-hidden="true"></div>
  <div class="hero-content">
    <div class="hero-meta">
      <div class="hero-meta-badge" id="hero-badge">Accessibility Prototype Hub</div>
      <span class="hero-match" id="hero-match">New 2025</span>
    </div>
    <h1 class="hero-title" id="hero-title"></h1>
    <p class="hero-desc" id="hero-desc"></p>
    <div class="hero-btns">
      <button class="hero-btn-play" id="hero-play" onclick="openFirst()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <span id="hero-play-txt"></span>
      </button>
      <button class="hero-btn-info" id="hero-info" onclick="scrollToRows()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="hero-info-txt"></span>
      </button>
    </div>
  </div>
</section>

<main id="main">
  <div class="rows" id="rowsContainer"></div>
</main>

<footer class="site-footer">
  <div class="footer-logo"><em>byeol</em> &#215; DOT</div>
  <div class="footer-meta" id="footer-meta"></div>
  <div class="footer-links">
    <a href="https://github.com/byeol-coder/project_byeol" class="footer-link" target="_blank" rel="noopener" id="fl-gh">GitHub</a>
    <a href="https://www.dotincorp.com" class="footer-link" target="_blank" rel="noopener" id="fl-dot">Dot Inc.</a>
  </div>
</footer>

  document.getElementById('hero-info-txt').textContent = t('heroInfo');
  document.getElementById('footer-meta').textContent = t('footerMeta');
  document.getElementById('nl-home').textContent = t('navHome');
  document.getElementById('nl-a11y').textContent = t('navA11y');
  document.getElementById('nl-game').textContent = t('navGame');
  document.getElementById('nl-ai').textContent = t('navAI');
}

// ── CARD ──
function createCard(p){
  const a = document.createElement('a');
  a.className = 'card';
  a.href = p.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.setAttribute('aria-label', `${p.title[lang]} — ${p.tagline[lang]} (${t('openNew')})`);
  a.tabIndex = 0;

  // Inner wrapper
  const inner = document.createElement('div');
  inner.className = 'card-inner';

  // Thumb
  const thumb = document.createElement('div');
  thumb.className = 'card-thumb';
  thumb.innerHTML = THUMBS[p.id] || '';
  thumb.setAttribute('aria-hidden','true');

  // Popup
  const popup = document.createElement('div');
  popup.className = 'card-popup';

  const btns = document.createElement('div');
  btns.className = 'popup-buttons';
  btns.setAttribute('aria-hidden','true');

  const playBtn = document.createElement('div');
  playBtn.className = 'popup-btn-play';
  playBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="#111"><path d="M8 5v14l11-7z"/></svg>';

  const addBtn = document.createElement('div');
  addBtn.className = 'popup-btn-circle';
  addBtn.textContent = '+';

  const match = document.createElement('span');
  match.className = 'popup-match';
  match.textContent = p.cat === 'ai' ? 'AI' : p.cat === 'game' ? 'Game' : 'A11y';

  btns.appendChild(playBtn);
  btns.appendChild(addBtn);
  btns.appendChild(match);

  const tags = document.createElement('div');
  tags.className = 'popup-tags';
  tags.setAttribute('aria-hidden','true');
  p.tags.slice(0,3).forEach(tg => {
    const c = BC[tg] || '#888';
    const sp = document.createElement('span');
    sp.className = 'popup-tag';
    sp.style.cssText = `background:${c}1e;color:${c};border:1px solid ${c}40`;
    sp.textContent = tg;
    tags.appendChild(sp);
  });

  const title = document.createElement('div');
  title.className = 'popup-title';
  title.textContent = p.title[lang];

  const desc = document.createElement('p');
  desc.className = 'popup-desc';
  desc.textContent = p.desc[lang];

  popup.appendChild(btns);
  popup.appendChild(tags);
  popup.appendChild(title);
  popup.appendChild(desc);

  inner.appendChild(thumb);
  inner.appendChild(popup);
  a.appendChild(inner);

  const sr = document.createElement('span');
  sr.className = 'sr-only';
  sr.textContent = t('openNew') + '.';
  a.appendChild(sr);

  return a;
}

// ── ROWS ──
const ROW_DEFS = [
  { id:'accessibility', labelKey:'catAccLabel', filter: p => p.cat === 'accessibility' },
  { id:'game',          labelKey:'catGameLabel', filter: p => p.cat === 'game' },
  { id:'ai',            labelKey:'catAILabel',   filter: p => p.cat === 'ai' },
  { id:'education',     labelKey:'catEduLabel',  filter: p => p.cat === 'education' },
  { id:'all',           labelKey:'catAllLabel',  filter: () => true },
];

function renderRows(){
  const container = document.getElementById('rowsContainer');
  container.innerHTML = '';

  ROW_DEFS.forEach(({id, labelKey, filter}) => {
    const filtered = PROJECTS.filter(filter);
    if(!filtered.length) return;

    const row = document.createElement('section');
    row.className = 'row';
    row.id = 'row-' + id;
    row.setAttribute('aria-label', t(labelKey));

    const titleEl = document.createElement('h2');
    titleEl.className = 'row-title';
    titleEl.innerHTML = `${t(labelKey)} <span class="row-arrow">${t('rowArrow')}</span>`;

    const trackWrap = document.createElement('div');
    trackWrap.className = 'track-wrap';

    const track = document.createElement('div');
    track.className = 'track';
    track.setAttribute('role','list');

    filtered.forEach(p => {
      const card = createCard(p);
      card.setAttribute('role','listitem');
      track.appendChild(card);
    });

    trackWrap.appendChild(track);
    row.appendChild(titleEl);
    row.appendChild(trackWrap);
    container.appendChild(row);
  });

  // footer count
  document.getElementById('footer-meta').textContent =
    `${t('footerMeta')} · ${PROJECTS.length} ${t('projects')}`;
}

function renderAll(){
  renderHero();
  renderRows();
}

// ── HERO ACTIONS ──
function openFirst(){
  const first = PROJECTS[0];
  window.open(first.url, '_blank', 'noopener,noreferrer');
}
function scrollToRows(){
  document.getElementById('rowsContainer').scrollIntoView({behavior:'smooth'});
}

// ── STICKY NAV ──
window.addEventListener('scroll', () => {
  document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 80);
}, {passive:true});

// ── INIT ──
renderAll();
</script>
